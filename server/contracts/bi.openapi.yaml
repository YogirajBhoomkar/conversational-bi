# Conversational BI API, contract 1.4.0. Generated by npm run contracts; do not edit.
openapi: "3.1.0"
info:
  title: "Conversational BI"
  version: "1.4.0"
  description: "Ask questions about data in plain language. The path prefix is BI_ROUTE_PREFIX (default /bi). Every response carries X-Trace-Id; a caller may send traceparent or X-Trace-Id to join its own trace. The caller is identified by the host (an Okta bearer token in GC)."
paths:
  "/bi/chat":
    post:
      summary: "Ask a question; the answer streams back as Server-Sent Events"
      description: "Each `data:` line is one ChatEvent (JSON). Lines starting with `:` are keep-alive comments. The stream ends after `final` (and any `suggestions`), or after `error`."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: "The answer stream"
          content:
            "text/event-stream":
              schema:
                "$ref": "#/components/schemas/ChatEvent"
        "400":
          description: "The body does not match the schema"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "No valid identity"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: "The body is larger than BI_MAX_BODY_BYTES"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too many questions running (Retry-After says when to try again)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "A bug; the body holds the trace id"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "Switched off (BI_ENABLED=false) or restarting (Retry-After says when to try again)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/bi/feedback":
    post:
      summary: "Rate an answer; passed on to Genie"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/FeedbackRequest"
      responses:
        "200":
          description: "Recorded"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  ok:
                    const: true
        "400":
          description: "The body does not match the schema"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "No valid identity"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: "The body is larger than BI_MAX_BODY_BYTES"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too many questions running (Retry-After says when to try again)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "A bug; the body holds the trace id"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "Genie refused"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "Switched off (BI_ENABLED=false) or restarting (Retry-After says when to try again)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/bi/client-config":
    get:
      summary: "Proposed: settings the UI needs (where feedback emails go, the user ref of the caller, versions)"
      responses:
        "200":
          description: "Client settings"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ClientConfig"
        "401":
          description: "No valid identity"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "A bug; the body holds the trace id"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/bi/feedback/opened":
    post:
      summary: "Proposed: count that a feedback email was opened (type only, no chat text)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/FeedbackOpened"
      responses:
        "204":
          description: "Counted"
        "400":
          description: "The body does not match the schema"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "No valid identity"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: "The body is larger than BI_MAX_BODY_BYTES"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "A bug; the body holds the trace id"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/bi/.well-known/agent-card.json":
    get:
      summary: "What this assistant can do: its data areas as skills, and the Send feedback email setup as an extension. Built from configuration; never the prompt"
      responses:
        "200":
          description: "The agent card"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AgentCard"
        "401":
          description: "No valid identity"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "A bug; the body holds the trace id"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/bi/version":
    get:
      summary: "Contract and build version"
      responses:
        "200":
          description: "Versions"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "service"
                  - "contract"
                  - "build"
                properties:
                  service:
                    type: "string"
                  contract:
                    type: "string"
                  build:
                    type: "string"
  "/health/live":
    get:
      summary: "Liveness: the process answers"
      responses:
        "200":
          description: "Alive"
  "/health/ready":
    get:
      summary: "Readiness: takes new questions (no Databricks call)"
      responses:
        "200":
          description: "Ready"
        "503":
          description: "Shutting down"
components:
  schemas:
    ChatRequest:
      type: "object"
      properties:
        threadId:
          type: "string"
          minLength: 1
          maxLength: 200
        message:
          type: "string"
          minLength: 1
          maxLength: 4000
        history:
          maxItems: 10
          type: "array"
          items:
            type: "object"
            properties:
              question:
                type: "string"
                minLength: 1
                maxLength: 4000
              answer:
                type: "string"
                maxLength: 20000
              space:
                type: "string"
                maxLength: 100
              sql:
                type: "string"
                maxLength: 20000
            required:
              - "question"
              - "answer"
      required:
        - "threadId"
        - "message"
    FeedbackRequest:
      type: "object"
      properties:
        spaceId:
          type: "string"
          minLength: 1
        conversationId:
          type: "string"
          minLength: 1
        messageId:
          type: "string"
          minLength: 1
        rating:
          type: "string"
          enum:
            - "POSITIVE"
            - "NEGATIVE"
      required:
        - "spaceId"
        - "conversationId"
        - "messageId"
        - "rating"
    ChatEvent:
      oneOf:
        - type: "object"
          properties:
            type:
              type: "string"
              const: "trace"
            item:
              type: "object"
              properties:
                id:
                  type: "string"
                  description: "Sending the same id again updates the entry"
                kind:
                  type: "string"
                  enum:
                    - "meta"
                    - "note"
                    - "tool"
                    - "progress"
                text:
                  description: "meta/note/progress: the line itself. tool: the question sent to the data source. An empty note has become the answer"
                  type: "string"
                label:
                  description: "meta: what the value is. tool: the data source name"
                  type: "string"
                by:
                  description: "Who is acting, when it is not the assistant"
                  type: "string"
                parent:
                  description: "progress: id of the tool entry it belongs to"
                  type: "string"
                step:
                  description: "progress only: what kind of line it is"
                  type: "string"
                  enum:
                    - "thought"
                    - "status"
                    - "query"
                status:
                  description: "tool entries, and progress lines that run (queries, loading rows)"
                  type: "string"
                  enum:
                    - "running"
                    - "done"
                    - "error"
              required:
                - "id"
                - "kind"
          required:
            - "type"
            - "item"
          description: "One scratchpad entry; the same id again updates it"
        - type: "object"
          properties:
            type:
              type: "string"
              const: "text"
            delta:
              type: "string"
          required:
            - "type"
            - "delta"
          description: "The answer, streamed as it is written (Markdown)"
        - type: "object"
          properties:
            type:
              type: "string"
              const: "text-reset"
          required:
            - "type"
          description: "The answer text streamed so far was a working note after all: clear it"
        - type: "object"
          properties:
            type:
              type: "string"
              const: "final"
            result:
              type: "object"
              properties:
